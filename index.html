<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vinay V — Software Engineer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#eef1f5;
    --ink:#0a0a0a;
    --ink-2:#1c1c1e;
    --muted:#5f6672;
    --dim:#8a8f99;
    --line:rgba(10,10,10,.08);
    --blue:#2563eb;

    --glass-bg:rgba(255,255,255,.10);
    --glass-bg-strong:rgba(255,255,255,.16);
    --glass-border-dim:rgba(255,255,255,.30);
    --glass-blur:22px;
    --glass-shadow:
      0 1px 0 rgba(255,255,255,.65) inset,
      0 -1px 0 rgba(0,0,0,.06) inset,
      0 12px 40px -16px rgba(10,20,40,.20);

    --font:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;

    --ease:cubic-bezier(.4,0,.2,1);
    --ease-out:cubic-bezier(0,0,.2,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    letter-spacing:-.012em;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    position:relative;
    min-height:100vh;
    overflow-x:hidden;
    width:100%;
  }

  /* ---------- Backdrop ---------- */
  .backdrop{
    position:fixed;inset:0;z-index:0;overflow:hidden;
    background:
      radial-gradient(ellipse 80% 60% at 15% 20%, rgba(37,99,235,.22), transparent 60%),
      radial-gradient(ellipse 70% 60% at 85% 15%, rgba(120,140,200,.20), transparent 60%),
      radial-gradient(ellipse 80% 70% at 75% 85%, rgba(37,99,235,.14), transparent 60%),
      radial-gradient(ellipse 60% 50% at 25% 90%, rgba(140,160,220,.16), transparent 60%),
      linear-gradient(180deg,#eef1f5 0%,#e7ebf2 100%);
  }
  .backdrop::before{
    content:"";position:absolute;inset:-10%;
    background:
      radial-gradient(circle 400px at 25% 35%, rgba(120,150,230,.35), transparent 70%),
      radial-gradient(circle 500px at 75% 65%, rgba(90,120,200,.28), transparent 70%),
      radial-gradient(circle 350px at 50% 15%, rgba(180,200,255,.30), transparent 70%),
      radial-gradient(circle 450px at 60% 90%, rgba(60,90,180,.20), transparent 70%);
    filter:blur(60px) saturate(140%);
    animation:drift 40s ease-in-out infinite;
    will-change:transform;
  }
  @keyframes drift{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    33%{transform:translate3d(2%,-3%,0) scale(1.06)}
    66%{transform:translate3d(-3%,2%,0) scale(.96)}
  }
  .grain{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    opacity:.05;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .shell{position:relative;z-index:2}

  ::selection{background:var(--blue);color:#fff}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}

  /* ---------- Nav (fixed for mobile) ---------- */
  .nav{
    position:fixed;top:12px;left:50%;transform:translateX(-50%);
    z-index:100;
    width:min(1160px, calc(100% - 24px));
    max-width:calc(100% - 24px);
    border-radius:100px;
    background:var(--glass-bg-strong);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid var(--glass-border-dim);
    box-shadow:
      0 1px 0 rgba(255,255,255,.7) inset,
      0 -1px 0 rgba(0,0,0,.04) inset,
      0 10px 32px -12px rgba(10,20,40,.18);
    overflow:hidden;
  }
  .nav-inner{
    padding:10px 14px 10px 18px;
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;
    flex-wrap:nowrap;
    position:relative;z-index:2;
  }
  .brand{
    font-size:15px;font-weight:600;letter-spacing:-.02em;
    display:flex;align-items:baseline;gap:7px;
    flex-shrink:0;
  }
  .brand sup{
    font-family:var(--mono);font-size:9px;
    color:var(--dim);letter-spacing:.06em;
    position:relative;top:-5px;font-weight:500;
  }
  .nav-links{
    display:flex;gap:20px;font-size:14px;color:var(--muted);
    flex-shrink:1;overflow:hidden;white-space:nowrap;
  }
  .nav-links a{transition:color .2s var(--ease)}
  .nav-links a:hover{color:var(--ink)}
  .nav-cta{
    font-size:13px;font-weight:500;
    padding:7px 14px;
    background:var(--ink);color:#fff;
    border-radius:100px;
    white-space:nowrap;flex-shrink:0;
    transition:transform .2s var(--ease-out), background .2s var(--ease);
  }
  .nav-cta:hover{background:#222;transform:translateY(-1px)}

  @media (max-width:760px){
    .nav-links{display:none}
    .nav-inner{padding:8px 8px 8px 16px}
    .brand{font-size:14px}
    .brand sup{font-size:8px;top:-4px}
    .nav-cta{font-size:12px;padding:6px 12px}
  }
  @media (max-width:420px){
    .nav{width:calc(100% - 16px);max-width:calc(100% - 16px);top:8px}
    .nav-inner{padding:7px 7px 7px 14px}
    .brand{font-size:13px}
    .nav-cta{font-size:11px;padding:5px 10px}
  }

  .wrap{max-width:1160px;margin:0 auto;padding:0 28px;width:100%}
  @media (max-width:720px){ .wrap{padding:0 18px} }
  @media (max-width:420px){ .wrap{padding:0 14px} }

  /* ---------- Hero ---------- */
  .hero{padding:140px 0 80px}
  @media (max-width:860px){ .hero{padding:120px 0 60px} }
  @media (max-width:480px){ .hero{padding:104px 0 48px} }

  .hero-grid{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:72px;align-items:center;
  }
  @media (max-width:860px){ .hero-grid{grid-template-columns:1fr;gap:40px} }

  .hero .meta{
    font-family:var(--mono);font-size:11.5px;
    color:var(--dim);letter-spacing:.05em;
    display:flex;align-items:center;gap:12px;
    margin-bottom:28px;flex-wrap:wrap;
  }
  @media (max-width:480px){ .hero .meta{font-size:10.5px;gap:8px;margin-bottom:22px} }
  .hero .meta .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 0 0 rgba(37,99,235,.5);
    animation:pulseDot 2s var(--ease) infinite;
    flex-shrink:0;
  }
  @keyframes pulseDot{
    0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}
    70%{box-shadow:0 0 0 8px rgba(37,99,235,0)}
    100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}
  }

  .hero h1{
    font-size:clamp(2.2rem,5.6vw,4.6rem);
    font-weight:600;line-height:1.02;
    letter-spacing:-.045em;margin-bottom:22px;
    color:var(--ink);word-break:break-word;
  }
  @media (max-width:480px){ .hero h1{font-size:clamp(1.9rem,8vw,2.6rem);letter-spacing:-.03em} }
  .hero h1 .muted{color:var(--dim);font-weight:500}

  .hero .lede{
    font-size:clamp(.95rem,1.5vw,1.15rem);
    color:var(--muted);line-height:1.55;
    max-width:560px;margin-bottom:36px;
  }
  @media (max-width:480px){ .hero .lede{font-size:.95rem;margin-bottom:28px} }
  .hero .lede strong{color:var(--ink);font-weight:500}

  .hero-links{display:flex;gap:12px;flex-wrap:wrap}
  @media (max-width:480px){ .hero-links{gap:10px} }

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-size:14px;font-weight:500;
    padding:11px 20px;border-radius:100px;
    white-space:nowrap;
    transition:transform .2s var(--ease-out), background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
  }
  @media (max-width:480px){ .btn{font-size:13px;padding:10px 16px} }
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn-primary{background:var(--ink);color:#fff;border:1px solid var(--ink)}
  .btn-primary:hover{background:#222}
  .btn-glass{
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    color:var(--ink);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
  }
  .btn-glass:hover{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.85)}
  .btn .arrow{transition:transform .25s var(--ease-out)}
  .btn:hover .arrow{transform:translateX(3px)}

  .portrait{
    position:relative;
    aspect-ratio:3/4;
    border-radius:24px;
    overflow:hidden;
    background:rgba(255,255,255,.20);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:
      0 1px 0 rgba(255,255,255,.8) inset,
      0 24px 60px -20px rgba(10,20,40,.24);
    max-width:100%;
  }
  .portrait img{
    width:100%;height:100%;object-fit:cover;object-position:center 20%;
    opacity:0;transition:opacity .6s var(--ease-out);
  }
  .portrait img.loaded{opacity:1}
  @media (max-width:860px){ .portrait{max-width:380px;margin:0 auto} }
  @media (max-width:480px){ .portrait{max-width:300px} }

  /* ---------- Section ---------- */
  .section{padding:90px 0}
  @media (max-width:720px){ .section{padding:64px 0} }
  @media (max-width:480px){ .section{padding:52px 0} }
  .section + .section{border-top:1px solid var(--line)}

  .section-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:24px;margin-bottom:40px;flex-wrap:wrap;
  }
  @media (max-width:480px){ .section-head{margin-bottom:28px} }

  .section-label{
    font-family:var(--mono);font-size:11.5px;
    color:var(--dim);letter-spacing:.08em;text-transform:uppercase;
  }
  .section-title{
    font-size:clamp(1.6rem,3.4vw,2.6rem);
    font-weight:600;letter-spacing:-.035em;
    line-height:1.12;max-width:640px;margin-top:10px;
    word-break:break-word;
  }
  @media (max-width:480px){ .section-title{font-size:1.5rem;letter-spacing:-.025em} }

  /* ---------- Skills marquee ---------- */
  .marquee-wrap{
    -webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
    mask-image:linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
    padding:8px 0;overflow:hidden;
  }
  .marquee{
    display:flex;gap:16px;width:max-content;
    animation:marquee 60s linear infinite;
    will-change:transform;padding:8px 0;
  }
  .marquee:hover{animation-play-state:paused}
  @keyframes marquee{
    from{transform:translate3d(0,0,0)}
    to{transform:translate3d(-50%,0,0)}
  }

  .skill-card{
    flex:0 0 auto;width:300px;padding:24px;border-radius:22px;
    background:rgba(255,255,255,.14);
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,255,255,.5);
    box-shadow:
      0 1px 0 rgba(255,255,255,.7) inset,
      0 -1px 0 rgba(0,0,0,.05) inset,
      0 16px 40px -20px rgba(10,20,40,.22);
    position:relative;overflow:hidden;isolation:isolate;
    transition:transform .35s var(--ease-out), border-color .3s var(--ease), box-shadow .35s var(--ease-out);
  }
  @media (max-width:520px){ .skill-card{width:260px;padding:20px} }
  @media (max-width:380px){ .skill-card{width:230px;padding:18px} }
  .skill-card::before{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.45),transparent 35%);z-index:1;
  }
  .skill-card > *{position:relative;z-index:4}
  .skill-card:hover{
    transform:translateY(-3px);
    border-color:rgba(255,255,255,.8);
    box-shadow:
      0 1px 0 rgba(255,255,255,.85) inset,
      0 -1px 0 rgba(0,0,0,.05) inset,
      0 24px 50px -20px rgba(10,20,40,.30);
  }
  .skill-num{
    font-family:var(--mono);font-size:10.5px;
    color:var(--muted);letter-spacing:.06em;margin-bottom:16px;
    display:flex;align-items:center;gap:8px;
  }
  .skill-num::before{content:"";width:12px;height:1px;background:var(--blue);opacity:.65;}
  .skill-card h3{
    font-size:19px;font-weight:600;letter-spacing:-.025em;
    line-height:1.2;margin-bottom:8px;color:var(--ink);word-break:break-word;
  }
  @media (max-width:520px){ .skill-card h3{font-size:17px} }
  .skill-card p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:18px;min-height:40px;}
  @media (max-width:520px){ .skill-card p{font-size:12px;min-height:36px} }
  .skill-tags{display:flex;flex-wrap:wrap;gap:5px;padding-top:16px;border-top:1px solid rgba(10,10,10,.08);}
  .skill-tag{
    font-family:var(--mono);font-size:10px;
    padding:3px 9px;border-radius:100px;
    background:rgba(255,255,255,.4);
    border:1px solid rgba(255,255,255,.6);
    color:var(--ink-2);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }

  .marquee-hint{
    font-family:var(--mono);font-size:11px;
    color:var(--dim);letter-spacing:.08em;text-transform:uppercase;
    margin-top:20px;display:flex;align-items:center;gap:10px;
  }
  @media (max-width:480px){ .marquee-hint{font-size:10px;margin-top:16px} }
  .marquee-hint::before{content:"";width:20px;height:1px;background:var(--dim);opacity:.5;}

  /* ---------- Interests ---------- */
  .interests-grid{
    display:grid;grid-template-columns:repeat(6,1fr);gap:16px;
  }
  @media (max-width:1000px){ .interests-grid{grid-template-columns:repeat(4,1fr)} }
  @media (max-width:640px){ .interests-grid{grid-template-columns:1fr} }

  .interest{
    grid-column:span 2;padding:26px;border-radius:22px;
    background:rgba(255,255,255,.14);
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,255,255,.5);
    box-shadow:
      0 1px 0 rgba(255,255,255,.7) inset,
      0 -1px 0 rgba(0,0,0,.05) inset,
      0 16px 40px -20px rgba(10,20,40,.22);
    position:relative;overflow:hidden;isolation:isolate;
    transition:transform .4s var(--ease-out), border-color .3s var(--ease), box-shadow .4s var(--ease-out);
  }
  @media (max-width:640px){ .interest{padding:22px} }
  @media (max-width:380px){ .interest{padding:18px} }
  .interest::before{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.45),transparent 35%);z-index:1;
  }
  .interest > *{position:relative;z-index:4}
  .interest:hover{
    transform:translateY(-3px);
    border-color:rgba(255,255,255,.8);
    box-shadow:
      0 1px 0 rgba(255,255,255,.85) inset,
      0 -1px 0 rgba(0,0,0,.05) inset,
      0 24px 50px -20px rgba(10,20,40,.30);
  }
  .interest-tag{
    font-family:var(--mono);font-size:10.5px;
    color:var(--muted);letter-spacing:.1em;text-transform:uppercase;
    margin-bottom:14px;display:flex;align-items:center;gap:8px;
  }
  .interest-tag::before{
    content:"";width:5px;height:5px;border-radius:50%;
    background:var(--blue);box-shadow:0 0 8px rgba(37,99,235,.6);flex-shrink:0;
  }
  .interest h3{
    font-size:17px;font-weight:600;letter-spacing:-.02em;
    line-height:1.25;margin-bottom:8px;color:var(--ink);word-break:break-word;
  }
  @media (max-width:480px){ .interest h3{font-size:16px} }
  .interest p{font-size:13px;line-height:1.5;color:var(--muted);}
  .interest .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px;}
  .interest .chip{
    font-family:var(--mono);font-size:10px;
    padding:3px 8px;border-radius:100px;
    background:rgba(255,255,255,.4);
    border:1px solid rgba(255,255,255,.6);
    color:var(--ink-2);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .interest.wide{grid-column:span 4}
  @media (max-width:1000px){ .interest.wide{grid-column:span 4} }
  @media (max-width:640px){ .interest, .interest.wide{grid-column:span 1} }

  /* ---------- Contact ---------- */
  .contact{padding:100px 0;border-top:1px solid var(--line);}
  @media (max-width:720px){ .contact{padding:64px 0} }
  @media (max-width:480px){ .contact{padding:52px 0} }

  .contact-card{
    padding:56px 48px;border-radius:28px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(28px) saturate(180%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,.55);
    box-shadow:
      0 1px 0 rgba(255,255,255,.75) inset,
      0 -1px 0 rgba(0,0,0,.04) inset,
      0 24px 60px -24px rgba(10,20,40,.22);
    position:relative;overflow:hidden;isolation:isolate;
  }
  @media (max-width:720px){ .contact-card{padding:40px 28px} }
  @media (max-width:480px){ .contact-card{padding:32px 20px} }
  .contact-card::before{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.5),transparent 35%);z-index:1;
  }
  .contact-card > *{position:relative;z-index:4}
  .contact-card h2{
    font-size:clamp(1.8rem,4.4vw,3rem);
    font-weight:600;letter-spacing:-.04em;
    line-height:1.08;margin-bottom:18px;max-width:640px;word-break:break-word;
  }
  @media (max-width:480px){ .contact-card h2{font-size:1.6rem;letter-spacing:-.03em} }
  .contact-card p{font-size:15px;color:var(--muted);max-width:520px;margin-bottom:32px;line-height:1.6;}
  @media (max-width:480px){ .contact-card p{font-size:14px;margin-bottom:26px} }
  .contact-links{display:flex;gap:12px;flex-wrap:wrap}
  @media (max-width:480px){ .contact-links{gap:10px} }

  /* ---------- Footer ---------- */
  footer{border-top:1px solid var(--line);padding:32px 0;}
  @media (max-width:480px){ footer{padding:24px 0} }
  .footer-inner{
    display:flex;justify-content:space-between;align-items:center;
    gap:16px;flex-wrap:wrap;
    font-family:var(--mono);font-size:11.5px;
    color:var(--dim);letter-spacing:.04em;
  }
  @media (max-width:480px){ .footer-inner{font-size:10.5px;gap:12px;justify-content:center;text-align:center} }
  .footer-inner .links{display:flex;gap:20px}
  @media (max-width:480px){ .footer-inner .links{gap:16px} }
  .footer-inner a{transition:color .2s var(--ease)}
  .footer-inner a:hover{color:var(--ink)}

  /* ---------- Reveal ---------- */
  .reveal{
    opacity:0;transform:translateY(14px);
    transition:opacity .7s var(--ease-out), transform .7s var(--ease-out);
  }
  .reveal.in{opacity:1;transform:translateY(0)}
  .reveal.d1{transition-delay:.05s}
  .reveal.d2{transition-delay:.1s}
  .reveal.d3{transition-delay:.15s}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms!important;
      transition-duration:.01ms!important;
      scroll-behavior:auto!important;
    }
    .marquee{animation:none!important;transform:translate3d(0,0,0)!important}
    .backdrop::before{animation:none!important}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>

<div class="backdrop"></div>
<div class="grain"></div>
<div class="shell" id="shell"></div>

<script>
/* =====================================================================
   SEED — used only if API returns nothing
   ===================================================================== */
const DEFAULT_DOC = {
  meta: {
    title: "Vinay V — Software Engineer",
    description: "Software engineer building backend systems and ML infrastructure. Based in Hyderabad."
  },
  nav: {
    brand: "Vinay V",
    brandSub: "— 26",
    skillsLabel: "Skills",
    interestsLabel: "Interests",
    contactLabel: "Contact",
    ctaLabel: "Get in touch",
    ctaLink: "mailto:Vinaycharyvelpula@gmail.com"
  },
  hero: {
    status: "Available for work",
    location: "Hyderabad, IN",
    title1: "Software engineer,",
    title2: "building quiet systems.",
    lede: "I design and build <strong>backend systems</strong> and <strong>ML infrastructure</strong> — services that stay correct under load, and models that behave predictably in production.",
    primaryBtnLabel: "View skills",

/* =====================================================================
   HELPERS
   ===================================================================== */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = a => Array.isArray(a) ? a : [];

/* Filter out empty DB entries — {label:"", href:""} etc */
const cleanItems = (items, keys) => arr(items).filter(it =>
  it && keys.every(k => it[k] && String(it[k]).trim() !== '')
);

function deepMerge(base, src){
  if(Array.isArray(base)) return Array.isArray(src) ? src : base;
  if(base && typeof base === 'object'){
    if(!src || typeof src !== 'object') return base;
    for(const k in src) base[k] = (k in base) ? deepMerge(base[k], src[k]) : src[k];
    return base;
  }
  return (src === undefined || src === null) ? base : src;
}

/* =====================================================================
   POST-RENDER
   ===================================================================== */
let io = null;

function afterRender(){
  const m = document.getElementById('marquee');
  if(m){
    const originals = Array.from(m.children);
    originals.forEach(node => {
      const clone = node.cloneNode(true);
      clone.setAttribute('aria-hidden','true');
      m.appendChild(clone);
    });
  }

  document.querySelectorAll('img.autoload').forEach(img => {
    if(img.complete && img.naturalWidth > 0) img.classList.add('loaded');
    else {
      img.addEventListener('load', ()=>img.classList.add('loaded'), {once:true});
      img.addEventListener('error', ()=>img.classList.add('loaded'), {once:true});
    }
  });

  updateClock();

  if(io) io.disconnect();
  io = new IntersectionObserver(entries => {
    for(const e of entries){
      if(e.isIntersecting){
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    }
  }, {threshold:0.1, rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
}

function updateClock(){
  const t = new Date().toLocaleTimeString('en-GB', {
    timeZone:'Asia/Kolkata', hour12:false, hour:'2-digit', minute:'2-digit'
  });
  const el = document.getElementById('clock');
  if(el) el.textContent = t;
}

/* =====================================================================
   LOAD — no more silent failures
   ===================================================================== */
async function load(){
  let remote = null;

  // Try relative path first (works when HTML is served from same origin as the API).
  // Fall back to absolute URL if relative fails.
  const urls = ['/api/data', 'https://www.vinayvelpula.in/api/data'];

  for(const url of urls){
    try{
      console.log('[load] fetching', url);
      const r = await fetch(url, {
        cache: 'no-store',
        credentials: 'include',
        headers: { 'Accept': 'application/json' }
      });

      console.log('[load] status:', r.status, r.headers.get('content-type'));

      if(!r.ok){
        console.warn('[load] non-OK — skipping', url);
        continue;
      }

      const ct = r.headers.get('content-type') || '';
      if(!ct.includes('application/json')){
        const preview = await r.text();
        console.warn('[load] expected JSON, got:', ct, '| preview:', preview.slice(0, 200));
        continue;
      }

      const j = await r.json();
      console.log('[load] parsed keys:', Object.keys(j || {}));

      if(j && typeof j === 'object' && !Array.isArray(j) && Object.keys(j).length > 0){
        remote = j;
        console.log('[load] ✅ using remote data from', url);
        break;
      } else {
        console.warn('[load] empty object from', url);
      }
    }catch(e){
      console.error('[load] fetch failed for', url, e);
    }
  }

  if(!remote){
    console.warn('[load] ❌ no remote data — using DEFAULT_DOC');
  } else {
    console.log('[load] ✅ remote data loaded');
  }

  state = remote ? deepMerge(structuredClone(DEFAULT_DOC), remote) : structuredClone(DEFAULT_DOC);
  render();

  try{ window.parent?.postMessage({type:'PORTFOLIO_READY'}, '*'); }catch(e){}
}

/* =====================================================================
   Live preview sync (admin → iframe)
   ===================================================================== */
window.addEventListener('message', e => {
  if(e.data && e.data.type === 'PORTFOLIO_UPDATE' && e.data.data){
    state = deepMerge(structuredClone(DEFAULT_DOC), e.data.data);
    render();
  }
});

/* =====================================================================
   BOOT
   ===================================================================== */
load();
setInterval(updateClock, 30000);
